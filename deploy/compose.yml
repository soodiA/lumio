# Lumio stack. Everything binds 127.0.0.1; host nginx is the only public listener.
# Persistent data are bind mounts under /srv/lumio.
name: lumio
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumio
    volumes:
      - /srv/lumio/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio -d lumio"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: lumio-api:${LUMIO_VERSION:-dev}
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lumio:${POSTGRES_PASSWORD}@db:5432/lumio?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8090:8080"
