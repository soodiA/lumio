# Lumio vhost behind the CDN (same model as tichi's nginx-tichi-cdn.conf: CDN terminates TLS, fetches over :80).
# The CDN->origin hop is NOT encrypted: it does not protect against someone who can sniff that network path.
limit_req_zone $binary_remote_addr zone=lumio_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lumio.tichikids.ir;
    root /srv/lumio/web;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/auth/ { limit_req zone=lumio_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8090; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /api/ { proxy_pass http://127.0.0.1:8090; include /etc/nginx/snippets/tichi-proxy.conf; }
    location = /healthz { proxy_pass http://127.0.0.1:8090; }
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}

# local-only listener for smoke tests / SSH-tunnel checks
server {
    listen 127.0.0.1:8082;
    root /srv/lumio/web;
    location /api/ { proxy_pass http://127.0.0.1:8090; include /etc/nginx/snippets/tichi-proxy.conf; }
    location = /healthz { proxy_pass http://127.0.0.1:8090; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
